<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b55">
  <meta name="description" content="Discover the places, culture, and experiences of Karnataka, India.">
  <title>Explore Karnataka</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17352b; background: #f5f8f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 760px); padding: clamp(2rem, 7vw, 5rem); background: white; border-radius: 1.5rem; box-shadow: 0 1rem 3rem #17352b12; }
    .eyebrow { color: #176b55; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .75rem 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1; letter-spacing: -.05em; }
    p { max-width: 56ch; color: #52665d; font-size: 1.1rem; line-height: 1.75; }
    .tagline { color: #176b55; font-size: 1.25rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Welcome to South India</div>
    <h1>Explore Karnataka</h1>
    <p class="tagline">A journey through heritage, nature, and culture.</p>
    <p>From the Western Ghats and the coast to historic cities and vibrant local traditions, Karnataka has something waiting around every corner. Start exploring and plan your next adventure.</p>
  </main>
</body>
</html>
